# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon.idletimeout=180000

# Environment / toolchain
# NeoForge for Minecraft 1.21.1 (port target); Java 21; ModDevGradle pinned in build.gradle.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod properties
mod_id=bubbleshield
mod_name=Bubble Shield
mod_license=CC0-1.0
mod_version=0.1.0
mod_group_id=com.bubbleshield
mod_authors=Bubble Shield Team
mod_description=Deployable bubble shields that protect what matters. NeoForge 1.21.1 port of the Fabric 26.2 mod.
